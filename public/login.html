<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BulkWA — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:  #25D366;
      --green2: #128C7E;
      --dark:   #0d1117;
      --card:   #161b22;
      --border: #30363d;
      --text:   #e6edf3;
      --muted:  #8b949e;
      --red:    #ef4444;
    }
    html, body {
      width: 100%; height: 100%;
    }
    body {
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(18,140,126,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(37,211,102,0.07) 0%, transparent 50%);
    }

    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    }

    /* Brand */
    .brand { text-align: center; margin-bottom: 40px; }
    .brand-icon {
      width: 76px; height: 76px;
      background: linear-gradient(135deg, var(--green2), var(--green));
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 8px 32px rgba(37,211,102,0.35);
    }
    /* WhatsApp SVG icon */
    .brand-icon svg { width: 44px; height: 44px; fill: white; }
    .brand h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.3px; }
    .brand p  { color: var(--muted); font-size: 0.88rem; margin-top: 6px; }

    /* Form */
    .form-group { margin-bottom: 20px; }
    label.field-label {
      display: block;
      font-size: 0.78rem; font-weight: 600;
      color: var(--muted);
      margin-bottom: 7px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
      font-size: 1rem; display: flex; align-items: center;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 13px 44px 13px 44px;
      background: #0d1117;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input:focus {
      border-color: var(--green2);
      box-shadow: 0 0 0 3px rgba(18,140,126,0.15);
    }
    .toggle-btn {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--muted); cursor: pointer; padding: 4px 6px;
      border-radius: 6px; font-size: 0.85rem; display: flex;
      transition: color 0.15s;
    }
    .toggle-btn:hover { color: var(--text); }

    /* Submit */
    .btn-login {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--green2), var(--green));
      border: none; border-radius: 10px;
      color: white; font-size: 1rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 10px;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 10px;
      box-shadow: 0 4px 20px rgba(37,211,102,0.3);
      letter-spacing: 0.2px;
    }
    .btn-login:hover   { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(37,211,102,0.4); }
    .btn-login:active  { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    /* Error */
    .error-box {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px; padding: 12px 16px;
      color: var(--red); font-size: 0.85rem;
      margin-bottom: 20px;
      align-items: center; gap: 10px;
    }
    .error-box.show { display: flex; }

    /* Divider */
    .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0 20px; }

    /* Footer */
    .footer { text-align: center; color: var(--muted); font-size: 0.75rem; }
    .footer span { color: var(--green); font-weight: 600; }

    /* Spinner keyframe */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; display: inline-block; }

    /* SVG icons inline */
    .icon-user, .icon-lock, .icon-eye, .icon-send { width:16px; height:16px; vertical-align:middle; }
  </style>
</head>
<body>
  <div class="login-box">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <!-- WhatsApp logo SVG -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.38 1.26 4.8L2.05 22l5.43-1.43c1.37.74 2.92 1.16 4.56 1.16 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm0 18.16c-1.47 0-2.87-.39-4.09-1.08l-.29-.17-3.03.8.81-2.95-.19-.3c-.77-1.26-1.17-2.7-1.17-4.17 0-4.49 3.66-8.14 8.16-8.14 2.18 0 4.23.85 5.77 2.39 1.54 1.54 2.38 3.59 2.37 5.77-.01 4.49-3.66 8.14-8.15 8.14zm4.49-6.1c-.25-.12-1.47-.72-1.69-.8-.23-.08-.39-.12-.56.12-.17.25-.64.8-.79.96-.14.17-.29.19-.54.07-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.44.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.44-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.42-.14 0-.3-.02-.46-.02-.16 0-.42.06-.64.31-.22.25-.84.82-.84 2s.86 2.31.98 2.47c.12.17 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.57.18 1.1.15 1.51.09.46-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.11-.23-.17-.48-.29z"/>
        </svg>
      </div>
      <h1>BulkWA Messenger</h1>
      <p>Sign in to access your dashboard</p>
    </div>

    <!-- Error -->
    <div id="err-box" class="error-box">
      <svg viewBox="0 0 24 24" class="icon-user" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <span id="err-text">Invalid username or password.</span>
    </div>

    <!-- Form -->
    <form id="login-form" onsubmit="doLogin(event)" autocomplete="off">

      <div class="form-group">
        <label class="field-label">Username</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" class="icon-user" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
          </span>
          <input id="username" type="text" placeholder="Enter username" required autocomplete="username"/>
        </div>
      </div>

      <div class="form-group">
        <label class="field-label">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" class="icon-lock" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </span>
          <input id="password" type="password" placeholder="Enter password" required autocomplete="current-password"/>
          <button type="button" class="toggle-btn" onclick="togglePass(this)" tabindex="-1">
            <svg id="eye-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="login-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg>
        Sign In
      </button>
    </form>

    <hr class="divider"/>
    <div class="footer">Protected &nbsp;•&nbsp; <span>BulkWA</span> &copy; 2026</div>
  </div>

  <script>
    // Already logged in? Go to dashboard
    if (sessionStorage.getItem('bulkwa_token')) {
      window.location.href = '/dashboard';
    }

    async function doLogin(e) {
      e.preventDefault();
      const btn  = document.getElementById('login-btn');
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spin">&#9696;</span>&nbsp; Signing in…';
      hideError();

      try {
        const res  = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();

        if (res.ok && data.token) {
          sessionStorage.setItem('bulkwa_token', data.token);
          sessionStorage.setItem('bulkwa_user',  user);
          window.location.href = '/dashboard';
        } else {
          showError(data.error || 'Invalid username or password.');
          resetBtn();
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch (err) {
        showError('Cannot connect to server. Please try again.');
        resetBtn();
      }
    }

    function resetBtn() {
      const btn = document.getElementById('login-btn');
      btn.disabled = false;
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg>
        Sign In`;
    }

    function showError(msg) {
      const box = document.getElementById('err-box');
      document.getElementById('err-text').textContent = msg;
      box.classList.add('show');
    }
    function hideError() {
      document.getElementById('err-box').classList.remove('show');
    }

    let passVisible = false;
    function togglePass(btn) {
      passVisible = !passVisible;
      const inp = document.getElementById('password');
      inp.type  = passVisible ? 'text' : 'password';
      document.getElementById('eye-svg').innerHTML = passVisible
        ? '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>'
        : '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
    }
  </script>
</body>
</html>
